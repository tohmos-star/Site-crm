name: Build Android debug APK

# Собирает android/ (гостевое приложение 404 Киберхаус) в GitHub Actions,
# т.к. в среде разработки заблокирован dl.google.com (нужен и для Android
# Gradle Plugin, и для самого SDK) — см. android/README.md.
#
# on: push (не только workflow_dispatch) — умышленно: workflow_dispatch
# требует, чтобы файл workflow'а сначала попал в дефолтную ветку репозитория
# (её мы не трогаем — эта ветка отдельная, по заданию), иначе GitHub не
# показывает кнопку/API для ручного запуска на не-дефолтной ветке. push
# триггерится сразу из содержимого коммита на самой ветке.
on:
  push:
    branches:
      - claude/android-guest-app
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest уже несёт предустановленный Android SDK (ANDROID_HOME
      # + sdkmanager на PATH) — отдельный setup-action не нужен и оказался
      # ненадёжным (android-actions/setup-android@v3 падает, пытаясь
      # поставить давно удалённый из репозитория Google пакет "tools").
      - name: Install SDK platform & build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | sort -V | tail -1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: club404-guest-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
