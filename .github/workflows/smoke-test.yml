name: Smoke test deployed CRM

# Проверяет боевой сервер снаружи (сама песочница разработки не имеет
# сетевого доступа к нему, только раннеры Actions) — health, публичный
# /api/status, админ-логин и что seed реально создал зоны/устройства/тарифы.
on:
  push:
    branches:
      - claude/crm-server-deployment-bmkzrr
    paths:
      - ".github/workflows/smoke-test.yml"
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Health + status + admin login + seeded data
        env:
          BASE: "http://92.242.60.149:3000"
          ADMIN_EMAIL: "admin@404kh.local"
          ADMIN_PASSWORD: "change-me-404"
        run: |
          set -euo pipefail

          echo "== GET /health =="
          curl -fsS "$BASE/health"; echo

          echo "== GET /api/status =="
          curl -fsS "$BASE/api/status"; echo

          echo "== GET /admin/login.html (frontend) =="
          curl -fsSI "$BASE/admin/login.html" | head -1

          echo "== POST /api/admin/login =="
          RESP=$(curl -fsS -X POST "$BASE/api/admin/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}")
          TOKEN=$(echo "$RESP" | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "Admin login failed, response: $RESP" >&2
            exit 1
          fi
          echo "OK: got admin token"

          echo "== GET /api/zones =="
          curl -fsS "$BASE/api/zones" -H "Authorization: Bearer $TOKEN" | jq '. as $z | {count: ($z | length), names: [.[].nameRu]}'

          echo "== GET /api/devices =="
          curl -fsS "$BASE/api/devices" -H "Authorization: Bearer $TOKEN" | jq '. as $d | {count: ($d | length)}'

          echo "== GET /api/tariffs =="
          curl -fsS "$BASE/api/tariffs" -H "Authorization: Bearer $TOKEN" | jq '.'

          echo "== GET /api/stations (expect status field) =="
          curl -fsS "$BASE/api/stations" | jq '.stations[0]'

          # Новые гостевые ручки (guestSelfService) — полного гостевого
          # аккаунта тут нет (регистрация требует фото + одобрение админом),
          # поэтому просто подтверждаем, что роуты зарегистрированы и
          # защищены гостевым JWT: без токена должно быть 401, а не 404.
          # Body должен пройти schema-валидацию (она у Fastify выполняется
          # ДО preHandler/auth) — иначе получим 400 вместо 401 и ничего не
          # докажем про сам роут.
          check_guest_route_exists() {
            local method="$1" path="$2" body="${3:-}"
            local code
            if [ -n "$body" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -X "$method" "$BASE$path" -H 'Content-Type: application/json' -d "$body")
            else
              code=$(curl -s -o /dev/null -w '%{http_code}' -X "$method" "$BASE$path")
            fi
            echo "$method $path -> $code"
            if [ "$code" != "401" ]; then
              echo "Expected 401 (route exists, guest auth required), got $code" >&2
              exit 1
            fi
          }

          echo "== Guest self-service routes (expect 401 without guest token) =="
          check_guest_route_exists POST /api/bookings/quote '{"stationId":"x","minutes":30}'
          check_guest_route_exists POST /api/sessions '{"stationId":"x","minutes":30}'
          check_guest_route_exists GET /api/sessions/active
          check_guest_route_exists POST /api/topup '{"amount":100}'
          check_guest_route_exists GET /api/refund-requests
          check_guest_route_exists GET /api/loyalty-tiers
          echo "OK: all guest self-service routes are registered and guarded"
