name: Smoke test deployed CRM

# Проверяет боевой сервер снаружи (сама песочница разработки не имеет
# сетевого доступа к нему, только раннеры Actions) — health, публичный
# /api/status, админ-логин и что seed реально создал зоны/устройства/тарифы.
on:
  push:
    branches:
      - claude/crm-server-deployment-bmkzrr
    paths:
      - ".github/workflows/smoke-test.yml"
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Health + status + admin login + seeded data
        env:
          BASE: "http://92.242.60.149:3000"
          ADMIN_EMAIL: "admin@404kh.local"
          ADMIN_PASSWORD: "change-me-404"
        run: |
          set -euo pipefail

          echo "== GET /health =="
          curl -fsS "$BASE/health"; echo

          echo "== GET /api/status =="
          curl -fsS "$BASE/api/status"; echo

          echo "== GET /admin/login.html (frontend) =="
          curl -fsSI "$BASE/admin/login.html" | head -1

          echo "== POST /api/admin/login =="
          RESP=$(curl -fsS -X POST "$BASE/api/admin/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}")
          TOKEN=$(echo "$RESP" | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "Admin login failed, response: $RESP" >&2
            exit 1
          fi
          echo "OK: got admin token"

          echo "== GET /api/zones =="
          curl -fsS "$BASE/api/zones" -H "Authorization: Bearer $TOKEN" | jq '. as $z | {count: ($z | length), names: [.[].nameRu]}'

          echo "== GET /api/devices =="
          curl -fsS "$BASE/api/devices" -H "Authorization: Bearer $TOKEN" | jq '. as $d | {count: ($d | length)}'

          echo "== GET /api/tariffs =="
          curl -fsS "$BASE/api/tariffs" -H "Authorization: Bearer $TOKEN" | jq '.'

          echo "== GET /api/stations (expect status field) =="
          curl -fsS "$BASE/api/stations" | jq '.stations[0]'

          # Новые гостевые ручки (guestSelfService) — полного гостевого
          # аккаунта тут нет (регистрация требует фото + одобрение админом),
          # поэтому просто подтверждаем, что роуты зарегистрированы и
          # защищены гостевым JWT: без токена должно быть 401, а не 404.
          # Body должен пройти schema-валидацию (она у Fastify выполняется
          # ДО preHandler/auth) — иначе получим 400 вместо 401 и ничего не
          # докажем про сам роут.
          check_guest_route_exists() {
            local method="$1" path="$2" body="${3:-}"
            local code
            if [ -n "$body" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -X "$method" "$BASE$path" -H 'Content-Type: application/json' -d "$body")
            else
              code=$(curl -s -o /dev/null -w '%{http_code}' -X "$method" "$BASE$path")
            fi
            echo "$method $path -> $code"
            if [ "$code" != "401" ]; then
              echo "Expected 401 (route exists, guest auth required), got $code" >&2
              exit 1
            fi
          }

          echo "== Guest self-service routes (expect 401 without guest token) =="
          check_guest_route_exists POST /api/bookings/quote '{"stationId":"x","minutes":30}'
          check_guest_route_exists POST /api/sessions '{"stationId":"x","minutes":30}'
          check_guest_route_exists GET /api/sessions/active
          check_guest_route_exists POST /api/topup '{"amount":100}'
          check_guest_route_exists GET /api/refund-requests
          echo "OK: all guest-authed self-service routes are registered and guarded"

          # /loyalty-tiers нарочно публичный (как /api/stations) — приложение
          # показывает каталог уровней ещё до логина.
          echo "== GET /api/loyalty-tiers (public) =="
          curl -fsS "$BASE/api/loyalty-tiers" | jq '. | length'

          echo "== GET /api/admin/access-credential (doorCodeMain должен быть массивом, doorCodeSecond быть не должно) =="
          curl -fsS "$BASE/api/admin/access-credential" -H "Authorization: Bearer $TOKEN" | jq '{doorCodeMain, hasSecondField: has("doorCodeSecond")}'

          echo "== GET /api/admin/guests (ожидаем поле doorCode у каждого гостя) =="
          GUESTS=$(curl -fsS "$BASE/api/admin/guests" -H "Authorization: Bearer $TOKEN")
          echo "$GUESTS" | jq '[.[] | {phone, doorCode}]'

          NO_CODE_ID=$(echo "$GUESTS" | jq -r '[.[] | select(.doorCode == null)][0].id // empty')
          if [ -n "$NO_CODE_ID" ]; then
            echo "== POST /api/admin/guests/$NO_CODE_ID/assign-door-code =="
            curl -fsS -X POST "$BASE/api/admin/guests/$NO_CODE_ID/assign-door-code" -H "Authorization: Bearer $TOKEN" | jq '{id, doorCode}'
          else
            echo "== Нет гостей с doorCode: null — пропускаю проверку назначения =="
          fi

          echo "== Автобонусы: создание тарифицированного правила пополнения (create + delete) =="
          CLUB_ID=$(curl -fsS "$BASE/api/clubs" -H "Authorization: Bearer $TOKEN" | jq -r '.[0].id')
          RULE=$(curl -fsS -X POST "$BASE/api/loyalty/auto-bonus-rules" -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"clubId\":\"$CLUB_ID\",\"trigger\":\"TOPUP\",\"rewardType\":\"PERCENT\",\"rewardValue\":20,\"minAmount\":1000,\"maxAmount\":2000}")
          echo "$RULE" | jq '{id, trigger, minAmount, maxAmount, rewardValue}'
          RULE_ID=$(echo "$RULE" | jq -r '.id')
          if [ -z "$RULE_ID" ] || [ "$RULE_ID" = "null" ]; then
            echo "Failed to create auto-bonus rule, response: $RULE" >&2
            exit 1
          fi
          echo "== GET /api/loyalty/auto-bonus-rules (правило должно быть в списке TOPUP) =="
          curl -fsS "$BASE/api/loyalty/auto-bonus-rules" -H "Authorization: Bearer $TOKEN" | jq --arg id "$RULE_ID" '[.[] | select(.id == $id)]'
          echo "== DELETE /api/loyalty/auto-bonus-rules/$RULE_ID =="
          DELETE_CODE=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "$BASE/api/loyalty/auto-bonus-rules/$RULE_ID" -H "Authorization: Bearer $TOKEN")
          echo "DELETE -> $DELETE_CODE"
          if [ "$DELETE_CODE" != "204" ]; then
            echo "Expected 204 on delete, got $DELETE_CODE" >&2
            exit 1
          fi
          AFTER_DELETE=$(curl -fsS "$BASE/api/loyalty/auto-bonus-rules" -H "Authorization: Bearer $TOKEN" | jq --arg id "$RULE_ID" '[.[] | select(.id == $id)] | length')
          if [ "$AFTER_DELETE" != "0" ]; then
            echo "Rule still present after delete" >&2
            exit 1
          fi
          echo "OK: tiered TOPUP auto-bonus rule create + delete round-trip works"

          echo "== Группы лояльности: назначение ручной группы и автогруппы гостю (в анкете) =="
          GUEST_ID=$(echo "$GUESTS" | jq -r '.[0].id // empty')
          MANUAL_GROUP_ID=$(curl -fsS "$BASE/api/loyalty/manual-groups" -H "Authorization: Bearer $TOKEN" | jq -r '.[0].id // empty')
          TIER_ID=$(curl -fsS "$BASE/api/loyalty/tiers" -H "Authorization: Bearer $TOKEN" | jq -r '.[0].id // empty')
          if [ -z "$GUEST_ID" ] || [ -z "$MANUAL_GROUP_ID" ] || [ -z "$TIER_ID" ]; then
            echo "Нет гостя/ручной группы/тира для проверки — пропускаю" >&2
          else
            # Запоминаем исходные значения, чтобы вернуть их после теста и не испортить реальные данные гостя.
            ORIG_MANUAL_GROUP=$(echo "$GUESTS" | jq -r '.[0].manualGroupId // "null"')
            ORIG_TIER=$(echo "$GUESTS" | jq -r '.[0].tierId // "null"')

            curl -fsS -X PUT "$BASE/api/guests/$GUEST_ID/manual-group" -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' -d "{\"manualGroupId\":\"$MANUAL_GROUP_ID\"}" > /dev/null
            curl -fsS -X PUT "$BASE/api/guests/$GUEST_ID/tier" -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' -d "{\"tierId\":\"$TIER_ID\"}" > /dev/null

            AFTER=$(curl -fsS "$BASE/api/admin/guests" -H "Authorization: Bearer $TOKEN" | jq --arg id "$GUEST_ID" '.[] | select(.id == $id) | {manualGroupId, manualGroupName, tierId, tierName}')
            echo "$AFTER"
            AFTER_MANUAL=$(echo "$AFTER" | jq -r '.manualGroupId')
            AFTER_TIER=$(echo "$AFTER" | jq -r '.tierId')
            if [ "$AFTER_MANUAL" != "$MANUAL_GROUP_ID" ] || [ "$AFTER_TIER" != "$TIER_ID" ]; then
              echo "Назначение группы/тира гостю не применилось" >&2
              exit 1
            fi

            # Возвращаем исходные значения гостя.
            ORIG_MANUAL_JSON=$([ "$ORIG_MANUAL_GROUP" = "null" ] && echo null || echo "\"$ORIG_MANUAL_GROUP\"")
            ORIG_TIER_JSON=$([ "$ORIG_TIER" = "null" ] && echo null || echo "\"$ORIG_TIER\"")
            curl -fsS -X PUT "$BASE/api/guests/$GUEST_ID/manual-group" -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' -d "{\"manualGroupId\":$ORIG_MANUAL_JSON}" > /dev/null
            curl -fsS -X PUT "$BASE/api/guests/$GUEST_ID/tier" -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' -d "{\"tierId\":$ORIG_TIER_JSON}" > /dev/null
            echo "OK: назначение ручной группы и автогруппы гостю работает (значения гостя возвращены к исходным)"
          fi
