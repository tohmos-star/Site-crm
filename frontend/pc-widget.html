<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Виджет на ПК — 404</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#0B0C0E; color:#E7ECF3;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .note { font-size:11px; color:#8592A3; padding:8px 14px; border-bottom:1px solid #232529;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<div class="note">оверлей на игровой станции · подключается к /api/pc/*</div>
<div id="pcwRoot"></div>
<script>
(function () {
  // Палитра оверлея станции — отдельная от основного бренда сайта (см.
  // референс-макеты виджета), мятно-зелёный вместо оранжевого как основной
  // акцент, янтарный/красный для предупреждений и ошибок.
  const BG = '#10141B', SURFACE = '#1A212B', SURFACE_ALT = '#212B38', BORDER = '#2A3441';
  const TEXT = '#E7ECF3', TEXT_MUTED = '#8592A3';
  const MINT = '#3ED598', AMBER = '#F2A93B', RED = '#F0555A';
  const MONO = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";
  const SANS = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  const MINUTE_STEP = 10;
  const TOPUP_AMOUNTS = [100, 500, 1000];
  const SUPPORT_REASONS = ['Не открывается дверь', 'Проблема с ПК', 'Оплата и баланс'];
  const DEVICE_TOKEN_KEY = 'pcw_device_token';

  // screen: 'setup' (нет/невалиден токен станции) | 'checking' (проверяем
  // активную сессию при загрузке) | 'code' (ввод кода брони) | 'active'.
  let deviceToken = localStorage.getItem(DEVICE_TOKEN_KEY) || null;
  let screen = deviceToken ? 'checking' : 'setup';
  let setupInput = '', setupError = null, setupSaving = false;

  let codeInput = '', codeError = null, redeeming = false;
  let sessionId = null, sessionEndsAt = null, stationLabel = '', hourlyTariff = 0;
  // Баланс — реальный Guest.balanceRub (MONEY), приходит с сервера в каждом
  // ответе pcAgent (redeem-code/session/extend). Демо-пополнение ниже меняет
  // только это отображаемое значение, не сервер — см. TOPUP note в модалке.
  let balance = 0;
  let sessionEnded = false, rebooting = false, visible = true;
  let modal = null;
  let extendMinutes = 30, extendPending = false, extendError = null;
  let cleanConfirmed = false;
  let supportReason = null, supportMessage = '', supportSent = false;
  let topupAmount = null, topupInput = '300', topupWantsReceipt = true, topupStage = 'pick';
  const log = [];

  const PACKAGES = () => ([
    { id: '3h', label: '3 часа', minutes: 180, price: Math.round(hourlyTariff * 3) },
    { id: '6h', label: '6 часов', minutes: 360, price: Math.round(hourlyTariff * 6 * 0.88) },
  ]);

  function fmtTime() { return new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }
  function fmtClock(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  }
  function pushLog(text) { log.unshift({ time: fmtTime(), text }); if (log.length > 6) log.pop(); }
  function minutePrice(min) { return Math.round((min / 60) * hourlyTariff); }
  function getRemainingMs() { return sessionEndsAt ? Math.max(0, sessionEndsAt.getTime() - Date.now()) : 0; }

  setInterval(() => { if (screen === 'active' && !sessionEnded && !rebooting) render(); }, 1000);

  async function apiFetch(path, opts) {
    const headers = Object.assign(
      { 'Content-Type': 'application/json' },
      opts && opts.headers,
      deviceToken ? { Authorization: 'Bearer ' + deviceToken } : {},
    );
    let res, data = null;
    try {
      res = await fetch(path, Object.assign({}, opts, { headers }));
      try { data = await res.json(); } catch { data = null; }
    } catch {
      return { ok: false, status: 0, data: null, networkError: true };
    }
    return { ok: res.ok, status: res.status, data };
  }

  function applySession(s) {
    sessionId = s.id;
    stationLabel = s.stationLabel;
    hourlyTariff = s.tariffPerHour;
    sessionEndsAt = new Date(s.endsAt);
    balance = s.guestBalanceRub ?? balance;
    sessionEnded = s.status !== 'ACTIVE';
  }

  function invalidateDeviceToken(message) {
    localStorage.removeItem(DEVICE_TOKEN_KEY);
    deviceToken = null;
    setupError = message || 'Токен станции недействителен — настройте заново';
    screen = 'setup';
  }

  // При загрузке страницы (в т.ч. после ребута ПК) проверяем, нет ли уже
  // активной сессии на этой станции — киоск не должен просить код повторно,
  // если гость просто перезагрузил браузер/ПК посреди оплаченного времени.
  async function checkSession() {
    screen = 'checking'; render();
    const { ok, status, data, networkError } = await apiFetch('/api/pc/session');
    if (!ok) {
      if (status === 401) { invalidateDeviceToken(); render(); return; }
      screen = 'code';
      codeError = networkError ? 'Нет связи с сервером' : null;
      render();
      return;
    }
    if (data && data.session) {
      applySession(data.session);
      screen = 'active';
    } else {
      screen = 'code';
    }
    render();
  }

  async function saveDeviceToken() {
    // Токен диктуют/вводят вручную — не важно, ввёл ли человек его с
    // дефисом, строчными буквами или пробелом, нормализуем перед отправкой.
    const token = setupInput.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!token) return;
    setupSaving = true; setupError = null; render();
    deviceToken = token;
    const { ok, status } = await apiFetch('/api/pc/session');
    if (!ok) {
      setupSaving = false;
      deviceToken = null;
      setupError = status === 401 ? 'Неверный токен станции' : 'Не удалось проверить токен — нет связи с сервером';
      render();
      return;
    }
    localStorage.setItem(DEVICE_TOKEN_KEY, token);
    setupSaving = false; setupInput = '';
    await checkSession();
  }

  // Реальный вызов агента станции — POST /api/pc/redeem-code { code } с
  // Authorization: Bearer <agentToken станции>. Код действует строго до
  // конца оплаченного окна, без грейс-периода — просроченный код сервер
  // отклоняет (410), а не выдаёт новую сессию.
  async function submitCode() {
    if (codeInput.length !== 6) return;
    redeeming = true; codeError = null; render();
    const { ok, status, data, networkError } = await apiFetch('/api/pc/redeem-code', {
      method: 'POST',
      body: JSON.stringify({ code: codeInput }),
    });
    redeeming = false;
    if (!ok) {
      if (status === 401) { invalidateDeviceToken(); render(); return; }
      codeError = networkError ? 'Нет связи с сервером — попробуйте ещё раз' : (data && data.error) || 'Код не найден или уже использован';
      render();
      return;
    }
    applySession(data);
    codeInput = '';
    screen = 'active';
    pushLog(`Код принят — сессия начата (${data.stationLabel})`);
    render();
  }

  async function doExtend(minutes) {
    if (extendPending || !sessionId) return;
    extendPending = true; extendError = null; render();
    const { ok, data, networkError } = await apiFetch(`/api/pc/session/${sessionId}/extend`, {
      method: 'POST',
      body: JSON.stringify({ minutes }),
    });
    extendPending = false;
    if (!ok) {
      extendError = networkError ? 'Нет связи с сервером' : (data && data.error) || 'Не удалось продлить';
      render();
      return;
    }
    applySession(data);
    modal = null;
    pushLog(`Продление: +${minutes} мин (баланс: ${balance} ₽)`);
    render();
  }
  function buyPackage(pkg) { doExtend(pkg.minutes); }
  function buyMinutes(min) { doExtend(min); }

  function goToReport() {
    if (!sessionId) return;
    window.location.href = `/report.html?session=${sessionId}&from=widget`;
  }

  function confirmReboot() {
    modal = null; rebooting = true; pushLog('Ручной ребут запрошен гостем — сессия не прерывается'); render();
    setTimeout(() => { rebooting = false; pushLog('ПК перезагружен, сессия продолжается'); render(); }, 2200);
  }
  function sendSupport() {
    if (!supportReason) return;
    supportSent = true; pushLog(`Заявка в техподдержку: ${supportReason}${supportMessage ? ' — ' + supportMessage : ''}`); render();
    setTimeout(() => { modal = null; render(); }, 1400);
  }
  // Демо: QR/СБП-пополнение внутри виджета — оплата не проводится на сервере
  // (реальный topup ещё не подключён к ПК-станции), меняем только то, что
  // видно на экране, чтобы показать сценарий.
  function generateQr() {
    const amount = parseInt(topupInput, 10); if (!amount) return;
    topupAmount = amount; topupStage = 'waiting'; render();
    setTimeout(() => confirmTopUp(amount), 2600);
  }
  function confirmTopUp(amount) {
    balance += amount; topupStage = 'paid'; pushLog(`Демо-пополнение (без записи на сервере): +${amount} ₽`); render();
    setTimeout(() => { modal = null; render(); }, 1100);
  }

  function btn(bg, color, extra) { return `padding:10px 8px;border-radius:8px;border:1px solid ${BORDER};background:${bg};color:${color || TEXT};font-size:13px;font-weight:500;cursor:pointer;${extra || ''}`; }

  function modalWrap(inner) {
    return `<div data-action="backdrop" style="position:fixed;inset:0;background:rgba(6,8,11,0.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;">
      <div style="position:relative;width:min(92%,340px);background:${SURFACE};border:1px solid ${BORDER};border-radius:14px;padding:22px;">
        <button data-action="close" style="position:absolute;top:10px;right:10px;background:transparent;border:none;color:${TEXT_MUTED};cursor:pointer;font-size:16px;">✕</button>
        ${inner}
      </div></div>`;
  }

  function renderModal() {
    if (!modal) return '';
    if (modal === 'extend') {
      const pkgCards = PACKAGES().map(pkg => {
        const affordable = balance >= pkg.price;
        return `<button data-action="buyPackage" data-pkg="${pkg.id}" ${(affordable && !extendPending) ? '' : 'disabled'} style="text-align:left;padding:10px 11px;border-radius:10px;border:1px solid ${BORDER};background:${SURFACE_ALT};color:${affordable ? TEXT : TEXT_MUTED};cursor:${affordable ? 'pointer' : 'not-allowed'};opacity:${affordable ? 1 : 0.5};">
          <div style="font-size:13px;font-weight:600;">${pkg.label}</div>
          <div style="font-size:13px;font-family:${MONO};margin-top:4px;">${pkg.price} ₽</div>
        </button>`;
      }).join('');
      const price = minutePrice(extendMinutes);
      const affordable = balance >= price;
      return modalWrap(`
        <div style="text-align:center;"><div style="font-size:15px;font-weight:600;">Продлить время</div><div style="font-size:12px;color:${TEXT_MUTED};margin-top:2px;">Баланс: ${balance} ₽ · тариф ${hourlyTariff} ₽/ч</div></div>
        <div style="font-size:12px;color:${TEXT_MUTED};margin:14px 0 6px;text-align:left;">Пакеты</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">${pkgCards}</div>
        <div style="border-top:1px solid ${BORDER};padding-top:12px;margin-top:14px;">
          <div style="font-size:12px;color:${TEXT_MUTED};margin-bottom:8px;text-align:left;">Поминутная тарификация · шаг ${MINUTE_STEP} мин</div>
          <div style="display:flex;align-items:center;gap:10px;">
            <button data-action="step" data-dir="-1" style="${btn(SURFACE_ALT, TEXT, 'width:36px;')}">−</button>
            <div style="flex:1;text-align:center;"><div style="font-family:${MONO};font-size:18px;font-weight:600;">${extendMinutes} мин</div><div style="font-family:${MONO};font-size:11.5px;color:${TEXT_MUTED};">${price} ₽</div></div>
            <button data-action="step" data-dir="1" style="${btn(SURFACE_ALT, TEXT, 'width:36px;')}">+</button>
          </div>
          <button data-action="buyMinutes" ${(affordable && !extendPending) ? '' : 'disabled'} style="width:100%;margin-top:10px;${btn(affordable ? MINT : SURFACE_ALT, affordable ? '#0B1D14' : TEXT_MUTED)}">${extendPending ? 'Продлеваем…' : `Продлить на ${extendMinutes} мин`}</button>
          ${extendError ? `<div style="color:${RED};font-size:12px;margin-top:8px;">${extendError}</div>` : ''}
        </div>`);
    }
    if (modal === 'end') {
      return modalWrap(`
        <div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;">
          <div style="font-size:34px;">▦</div>
          <div style="font-size:15px;font-weight:600;">Подтвердите чистоту рабочего места</div>
          <div style="font-size:13px;color:${TEXT_MUTED};">Заполните короткий чек-лист и приложите 2 фото места — сессия завершится после отправки.</div>
          <button data-action="goToReport" style="width:100%;${btn(MINT, '#0B1D14')}">Заполнить отчёт</button>
        </div>`);
    }
    if (modal === 'reboot') {
      return modalWrap(`
        <div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;">
          <div style="font-size:32px;color:${AMBER};">↻</div>
          <div style="font-size:15px;font-weight:600;">Перезагрузить ПК?</div>
          <div style="font-size:13px;color:${TEXT_MUTED};">Сессия не прервётся, оплаченное время продолжит отсчитываться.</div>
          <div style="display:flex;gap:8px;width:100%;">
            <button data-action="close" style="flex:1;${btn(SURFACE_ALT)}">Отмена</button>
            <button data-action="confirmReboot" style="flex:1;${btn(AMBER, '#1A1206')}">Перезагрузить</button>
          </div>
        </div>`);
    }
    if (modal === 'support') {
      const reasons = SUPPORT_REASONS.map(r => `<button data-action="setReason" data-reason="${r}" style="width:100%;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid ${supportReason === r ? MINT : BORDER};background:${supportReason === r ? SURFACE_ALT : 'transparent'};color:${TEXT};cursor:pointer;">${r}</button>`).join('');
      return modalWrap(`
        <div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;">
          <div style="font-size:32px;">🛟</div>
          <div style="font-size:15px;font-weight:600;">Тех.поддержка</div>
          <div style="font-size:12.5px;color:${TEXT_MUTED};margin-top:-4px;">90% проблем решаются перезагрузкой ПК</div>
          ${supportSent ? `<div style="color:${MINT};font-size:13px;">✓ Заявка отправлена, администратор уведомлён</div>` : `
          <div style="width:100%;text-align:left;"><div style="font-size:12px;color:${TEXT_MUTED};margin-bottom:6px;">Тема</div><div style="display:flex;flex-direction:column;gap:6px;">${reasons}</div></div>
          <div style="width:100%;text-align:left;"><div style="font-size:12px;color:${TEXT_MUTED};margin:10px 0 6px;">Сообщение</div><textarea data-action="supportMessage" rows="3" placeholder="Опишите проблему подробнее (необязательно)" style="width:100%;resize:none;background:${SURFACE_ALT};border:1px solid ${BORDER};border-radius:8px;color:${TEXT};font-size:13px;padding:10px;box-sizing:border-box;font-family:${SANS};"></textarea></div>
          <button data-action="sendSupport" ${supportReason ? '' : 'disabled'} style="width:100%;${btn(supportReason ? MINT : SURFACE_ALT, supportReason ? '#0B1D14' : TEXT_MUTED)}">Отправить</button>`}
        </div>`);
    }
    if (modal === 'topup') {
      let body = '';
      if (topupStage === 'pick') {
        const amount = parseInt(topupInput, 10);
        body = `
          <div style="font-size:11.5px;color:${TEXT_MUTED};background:${SURFACE_ALT};border:1px solid ${BORDER};border-radius:8px;padding:8px 10px;text-align:left;">Демо-режим — оплата не проводится, баланс на сервере не меняется</div>
          <div style="text-align:left;"><div style="font-size:12px;color:${TEXT_MUTED};margin-bottom:6px;">Сумма пополнения</div>
            <div style="display:flex;align-items:center;border:1px solid ${BORDER};border-radius:8px;background:${SURFACE_ALT};padding:10px 12px;">
              <input type="number" value="${topupInput}" data-action="topupInput" style="flex:1;background:transparent;border:none;outline:none;color:${TEXT};font-size:20px;font-weight:600;font-family:${MONO};">
              <span style="color:${TEXT_MUTED};">₽</span>
            </div></div>
          <div style="display:flex;gap:8px;">${TOPUP_AMOUNTS.map(a => `<button data-action="addTopup" data-amt="${a}" style="flex:1;${btn(SURFACE_ALT, TEXT, 'font-size:12.5px;')}">+${a} ₽</button>`).join('')}</div>
          <div style="display:flex;justify-content:space-between;font-size:12.5px;color:${TEXT_MUTED};"><span>Баланс после пополнения</span><span style="color:${TEXT};font-family:${MONO};">${balance + (amount || 0)} ₽</span></div>
          <div style="border-top:1px solid ${BORDER};padding-top:10px;">
            <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;"><input type="checkbox" data-action="toggleReceipt" ${topupWantsReceipt ? 'checked' : ''}> Получить электронный чек на почту</label>
          </div>
          <button data-action="generateQr" ${(amount && topupWantsReceipt) ? '' : 'disabled'} style="width:100%;${btn((amount && topupWantsReceipt) ? MINT : SURFACE_ALT, (amount && topupWantsReceipt) ? '#0B1D14' : TEXT_MUTED)}">Оплатить</button>`;
      } else if (topupStage === 'waiting') {
        body = `
          <div style="width:148px;height:148px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;margin:4px auto;font-size:60px;">▦</div>
          <div style="font-size:15px;font-weight:600;">${topupAmount} ₽ через СБП</div>
          <div style="font-size:12.5px;color:${TEXT_MUTED};">Ждём оплату…</div>
          <button data-action="forceConfirm" style="width:100%;${btn(SURFACE_ALT, TEXT_MUTED, 'font-size:12px;')}">Демо: платёж пришёл</button>`;
      } else {
        body = `<div style="color:${MINT};font-size:14px;padding:10px 0;">✓ Баланс пополнен на ${topupAmount} ₽ (демо)</div>`;
      }
      return modalWrap(`<div style="text-align:center;display:flex;flex-direction:column;gap:10px;">${body}</div>`);
    }
    return '';
  }

  function renderSetup() {
    const root = document.getElementById('pcwRoot');
    root.innerHTML = `
      <div style="min-height:420px;background:linear-gradient(180deg,#1B2A4A 0%,#2C4770 38%,#5C7D9E 62%,#7FA06B 78%,#4C6B3C 100%);position:relative;overflow:hidden;font-family:${SANS};border-radius:12px;display:flex;align-items:center;justify-content:center;">
        <div style="width:min(92%,340px);background:rgba(16,20,27,0.94);border:1px solid ${BORDER};border-radius:14px;padding:22px;text-align:center;">
          <div style="font-size:13px;font-weight:600;color:${TEXT};margin-bottom:4px;">404 · настройка станции</div>
          <div style="font-size:12px;color:${TEXT_MUTED};margin-bottom:18px;">Вставьте токен устройства, выданный админом в разделе «Устройства»</div>
          <input id="pcwSetupInput" value="${setupInput}" placeholder="K7M2-P9QX" autocomplete="off" maxlength="9"
            style="width:100%;text-align:center;background:${SURFACE_ALT};border:1px solid ${BORDER};border-radius:10px;color:${TEXT};font-family:${MONO};font-size:13px;padding:12px 10px;box-sizing:border-box;">
          ${setupError ? `<div style="color:${RED};font-size:12px;margin-top:10px;">${setupError}</div>` : ''}
          <button data-action="saveSetup" ${(setupInput.trim() && !setupSaving) ? '' : 'disabled'} style="width:100%;margin-top:14px;${btn(setupInput.trim() ? MINT : SURFACE_ALT, setupInput.trim() ? '#0B1D14' : TEXT_MUTED)}">${setupSaving ? 'Проверяем…' : 'Сохранить'}</button>
        </div>
      </div>`;
    const input = document.getElementById('pcwSetupInput');
    input.focus();
    input.setSelectionRange(setupInput.length, setupInput.length);
  }

  function render() {
    if (screen === 'setup') return renderSetup();
    const root = document.getElementById('pcwRoot');

    if (screen === 'checking') {
      root.innerHTML = `
        <div style="min-height:420px;background:linear-gradient(180deg,#1B2A4A 0%,#2C4770 38%,#5C7D9E 62%,#7FA06B 78%,#4C6B3C 100%);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:${SANS};">
          <div style="color:${TEXT_MUTED};font-size:13px;">Проверяем станцию…</div>
        </div>`;
      return;
    }

    if (screen === 'code') {
      root.innerHTML = `
        <div style="min-height:420px;background:linear-gradient(180deg,#1B2A4A 0%,#2C4770 38%,#5C7D9E 62%,#7FA06B 78%,#4C6B3C 100%);position:relative;overflow:hidden;font-family:${SANS};border-radius:12px;display:flex;align-items:center;justify-content:center;">
          <div style="width:min(92%,320px);background:rgba(16,20,27,0.94);border:1px solid ${BORDER};border-radius:14px;padding:22px;text-align:center;">
            <div style="font-size:13px;font-weight:600;color:${TEXT};margin-bottom:4px;">404 · станция свободна</div>
            <div style="font-size:12px;color:${TEXT_MUTED};margin-bottom:18px;">Введите код брони</div>
            <input id="pcwCodeInput" value="${codeInput}" placeholder="000000" maxlength="6" inputmode="numeric"
              style="width:100%;text-align:center;background:${SURFACE_ALT};border:1px solid ${BORDER};border-radius:10px;color:${TEXT};font-family:${MONO};font-size:28px;letter-spacing:0.15em;padding:12px 0;box-sizing:border-box;">
            ${codeError ? `<div style="color:${RED};font-size:12px;margin-top:10px;">${codeError}</div>` : ''}
            <button data-action="submitCode" ${(codeInput.length === 6 && !redeeming) ? '' : 'disabled'} style="width:100%;margin-top:14px;${btn(codeInput.length === 6 ? MINT : SURFACE_ALT, codeInput.length === 6 ? '#0B1D14' : TEXT_MUTED)}">${redeeming ? 'Проверяем…' : 'Подтвердить'}</button>
            <div style="font-size:11px;color:${TEXT_MUTED};margin-top:12px;">Код — в личном кабинете после бронирования на вкладке «Сайт»</div>
            <button data-action="openSetup" style="width:100%;margin-top:10px;background:transparent;border:none;color:${TEXT_MUTED};font-size:11px;cursor:pointer;text-decoration:underline;">Сменить токен станции</button>
          </div>
        </div>`;
      const input = document.getElementById('pcwCodeInput');
      input.focus();
      input.setSelectionRange(codeInput.length, codeInput.length);
      return;
    }

    const remainingMs = getRemainingMs();
    const plannedEnd = sessionEndsAt || new Date();
    root.innerHTML = `
      <div style="min-height:520px;background:linear-gradient(180deg,#1B2A4A 0%,#2C4770 38%,#5C7D9E 62%,#7FA06B 78%,#4C6B3C 100%);position:relative;overflow:hidden;font-family:${SANS};border-radius:12px;">
        <div style="position:absolute;bottom:0;left:0;right:0;height:34px;background:rgba(10,12,16,0.55);"></div>
        <div style="position:absolute;top:18px;right:14px;width:${visible ? '260px' : 'auto'};display:flex;flex-direction:column;align-items:${visible ? 'stretch' : 'flex-end'};">
        ${visible ? `
          <div style="background:rgba(16,20,27,0.9);border:1px solid ${BORDER};border-radius:12px;padding:13px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div style="font-size:13px;font-weight:600;color:${TEXT};">404 · ${stationLabel}</div>
              <div style="display:flex;align-items:center;gap:10px;">
                <div style="font-size:11.5px;color:${MINT};">📶 онлайн</div>
                <button data-action="minimize" style="background:transparent;border:none;color:${TEXT_MUTED};cursor:pointer;">−</button>
              </div>
            </div>
            <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;">
              <div style="font-size:12.5px;color:${TEXT_MUTED};font-family:${MONO};">Баланс: <span style="color:${TEXT};">${balance} ₽</span></div>
              <button data-action="open" data-modal="topup" style="display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;border:1px solid ${MINT};background:transparent;color:${MINT};font-size:11.5px;cursor:pointer;">+ Пополнить</button>
            </div>
            <div style="text-align:center;margin:14px 0 6px;">
              <div style="font-family:${MONO};font-size:34px;font-weight:600;color:${sessionEnded ? TEXT_MUTED : rebooting ? RED : remainingMs < 5 * 60000 ? AMBER : MINT};">${sessionEnded ? '--:--' : fmtClock(remainingMs)}</div>
              <div style="font-size:12px;color:${TEXT_MUTED};margin-top:2px;">${sessionEnded ? 'Сессия завершена' : rebooting ? 'Идёт перезагрузка…' : `оплачено до ${plannedEnd.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}`}</div>
            </div>
            ${!sessionEnded ? `
              <div style="display:flex;gap:8px;margin-top:14px;">
                <button data-action="open" data-modal="extend" style="flex:1;${btn(SURFACE_ALT)}">Продлить ▾</button>
                <button data-action="open" data-modal="end" style="flex:1;${btn(SURFACE_ALT)}">Завершить</button>
              </div>
              <div style="display:flex;gap:8px;margin-top:8px;">
                <button data-action="open" data-modal="reboot" style="flex:1;${btn(SURFACE, TEXT_MUTED)}">Перезагрузить</button>
                <button data-action="open" data-modal="support" style="flex:1;${btn(SURFACE, TEXT_MUTED)}">Техподдержка</button>
              </div>` : ''}
          </div>
          <div style="margin-top:10px;border:1px solid ${BORDER};border-radius:10px;overflow:hidden;background:rgba(16,20,27,0.7);">
            ${log.map((e, i) => `<div style="display:flex;gap:8px;padding:7px 11px;${i ? `border-top:1px solid ${BORDER};` : ''}font-size:11.5px;"><span style="font-family:${MONO};color:${TEXT_MUTED};flex-shrink:0;">${e.time}</span><span>${e.text}</span></div>`).join('')}
          </div>
        ` : `
          <button data-action="minimize" style="width:34px;height:34px;border-radius:8px;border:1px solid ${BORDER};background:rgba(16,20,27,0.9);cursor:pointer;position:relative;">🖥️<span style="position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:${MINT};"></span></button>
        `}
        </div>
        ${renderModal()}
      </div>`;
  }

  const root = document.getElementById('pcwRoot');

  root.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    if (action === 'backdrop' && e.target !== el) return;
    if (action === 'saveSetup') return saveDeviceToken();
    if (action === 'openSetup') { invalidateDeviceToken(null); render(); return; }
    if (action === 'submitCode') return submitCode();
    if (action === 'open') { extendError = null; return openModal(el.dataset.modal); }
    if (action === 'close' || action === 'backdrop') return closeModal();
    if (action === 'minimize') { visible = !visible; return render(); }
    if (action === 'step') { extendMinutes = Math.max(MINUTE_STEP, extendMinutes + Number(el.dataset.dir) * MINUTE_STEP); return render(); }
    if (action === 'buyPackage') return buyPackage(PACKAGES().find(p => p.id === el.dataset.pkg));
    if (action === 'buyMinutes') return buyMinutes(extendMinutes);
    if (action === 'goToReport') return goToReport();
    if (action === 'confirmReboot') return confirmReboot();
    if (action === 'setReason') { supportReason = el.dataset.reason; return render(); }
    if (action === 'sendSupport') return sendSupport();
    if (action === 'addTopup') { topupInput = String((parseInt(topupInput, 10) || 0) + Number(el.dataset.amt)); return render(); }
    if (action === 'generateQr') return generateQr();
    if (action === 'forceConfirm') return confirmTopUp(topupAmount);
  });

  root.addEventListener('input', (e) => {
    const el = e.target.closest('[data-action], #pcwCodeInput, #pcwSetupInput');
    if (!el) return;
    if (el.id === 'pcwCodeInput') { codeInput = el.value.replace(/\D/g, '').slice(0, 6); codeError = null; render(); return; }
    if (el.id === 'pcwSetupInput') { setupInput = el.value; render(); return; }
    if (el.dataset.action === 'topupInput') { topupInput = el.value.replace(/[^0-9]/g, ''); render(); }
    if (el.dataset.action === 'supportMessage') { supportMessage = el.value; }
  });

  root.addEventListener('keydown', (e) => {
    if (e.target?.id === 'pcwCodeInput' && e.key === 'Enter') submitCode();
    if (e.target?.id === 'pcwSetupInput' && e.key === 'Enter') saveDeviceToken();
  });

  root.addEventListener('change', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    if (el.dataset.action === 'toggleReceipt') { topupWantsReceipt = el.checked; render(); }
  });

  function openModal(m) {
    modal = m;
    if (m === 'support') { supportReason = null; supportMessage = ''; supportSent = false; }
    if (m === 'topup') { topupStage = 'pick'; topupInput = '300'; }
    render();
  }
  function closeModal() { modal = null; render(); }

  if (screen === 'checking') {
    checkSession();
  } else {
    render();
  }
})();

</script>
</body>
</html>
