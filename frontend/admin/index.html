<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — админка</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .admin-header {
      border-bottom: 1px solid var(--border); position: sticky; top: 0;
      background: rgba(11,12,14,0.95); backdrop-filter: blur(6px); z-index: 20;
    }
    .admin-header .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
    .tabs { display: flex; gap: 4px; padding: 12px 0; overflow-x: auto; border-bottom: 1px solid var(--border); }
    .tab-btn {
      background: none; border: 1px solid var(--border); color: var(--text-muted);
      padding: 8px 14px; border-radius: 7px; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .tab-btn.active { color: var(--text); background: var(--panel); border-color: var(--accent); }
    .tab-panel { display: none; padding: 24px 0; }
    .tab-panel.active { display: block; }
    table.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.admin-table th, table.admin-table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    table.admin-table th { color: var(--text-muted); font-weight: 500; font-size: 12px; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .row-actions button { font-size: 12px; padding: 6px 10px; }
    .thumb-link { color: var(--accent); text-decoration: none; font-size: 12px; }
    .filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .filter-row select, .filter-row input { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 13px; }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="wrap">
      <span style="font-weight:700;">4<span style="color:var(--accent);">0</span>4 · admin</span>
      <button class="btn btn-ghost" id="adminLogoutBtn" style="padding:8px 14px; font-size:13px;">Выйти</button>
    </div>
  </header>

  <main class="wrap">
    <div class="tabs">
      <button class="tab-btn active" data-tab="verification">Верификация анкет</button>
      <button class="tab-btn" data-tab="access">Домофон и коды</button>
      <button class="tab-btn" data-tab="guests">Гости</button>
      <button class="tab-btn" data-tab="analytics">Статистика</button>
    </div>

    <!-- ---- 1. Верификация анкет ---- -->
    <section class="tab-panel active" id="tab-verification">
      <div class="filter-row">
        <select id="vStatusFilter">
          <option value="pending">На проверке</option>
          <option value="approved">Одобренные</option>
          <option value="rejected">Отклонённые</option>
        </select>
        <button class="btn btn-ghost" id="vRefresh" style="padding:8px 14px; font-size:13px;">Обновить</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead><tr><th>Телефон</th><th>ФИО</th><th>Подано</th><th>Документы</th><th>Действия</th></tr></thead>
          <tbody id="vTableBody"><tr><td colspan="5" style="color:var(--text-muted);">Загрузка…</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- ---- 2. Домофон и коды ---- -->
    <section class="tab-panel" id="tab-access">
      <div class="form-panel" style="max-width:480px;">
        <form id="accessForm">
          <div class="field"><label>Ссылка на домофон</label><input type="text" id="accIntercom" placeholder="https://domovoy.city/skud/link/?token=..."></div>
          <div class="field"><label>Код основной двери</label><input type="text" id="accDoorMain" placeholder="1234567#"></div>
          <div class="field"><label>Код второй двери (если есть)</label><input type="text" id="accDoorSecond" placeholder="необязательно"></div>
          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Сохранить</button>
          <div class="status-msg" id="accessStatus"></div>
        </form>
      </div>
    </section>

    <!-- ---- 3. Гости ---- -->
    <section class="tab-panel" id="tab-guests">
      <div class="filter-row">
        <input type="text" id="gSearch" placeholder="Поиск по телефону или ФИО">
        <button class="btn btn-ghost" id="gSearchBtn" style="padding:8px 14px; font-size:13px;">Найти</button>
        <button class="btn btn-primary" id="gAddBtn" style="padding:8px 14px; font-size:13px;">+ Добавить вручную</button>
      </div>
      <div id="gAddForm" class="form-panel" style="max-width:420px; margin-bottom:16px; display:none;">
        <div class="field"><label>Телефон</label><input type="tel" id="gNewPhone" placeholder="+79991234567"></div>
        <div class="field"><label>ФИО</label><input type="text" id="gNewFio"></div>
        <button class="btn btn-primary" id="gAddSubmit" style="width:100%; justify-content:center;">Создать</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead><tr><th>Телефон</th><th>ФИО</th><th>Бонусы</th><th>Статус</th><th>Действия</th></tr></thead>
          <tbody id="gTableBody"><tr><td colspan="5" style="color:var(--text-muted);">Загрузка…</td></tr></tbody>
        </table>
      </div>
    </section>

    <!-- ---- 4. Статистика ---- -->
    <section class="tab-panel" id="tab-analytics">
      <div class="filter-row">
        <input type="date" id="aFrom">
        <input type="date" id="aTo">
        <button class="btn btn-ghost" id="aRefresh" style="padding:8px 14px; font-size:13px;">Показать</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="admin-table">
          <thead><tr><th>Источник</th><th>Этап</th><th>Кол-во</th></tr></thead>
          <tbody id="aTableBody"><tr><td colspan="3" style="color:var(--text-muted);">Выберите период и нажмите «Показать»</td></tr></tbody>
        </table>
      </div>
      <p class="sub" style="margin-top:16px;">Отчёт по системе лояльности — в разработке, будет отдельной вкладкой.</p>
    </section>
  </main>

  <script src="/admin/app.js"></script>
</body>
</html>
