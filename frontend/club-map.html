<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта клуба — 404</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .floor-plan {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 90px);
      gap: 10px;
      margin-bottom: 24px;
    }
    .room {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      text-align: center;
      padding: 6px;
    }
    .room .name { color: var(--text); font-size: 13px; margin-bottom: 2px; }
    .room.entrance { grid-column: 1 / 3; background: var(--panel-raised); border-color: var(--accent); color: var(--accent); }
    .room.bar { grid-column: 3 / 5; background: var(--panel-raised); }
    .room.duo1 { grid-column: 1 / 3; grid-row: 2; }
    .room.duo2 { grid-column: 3 / 5; grid-row: 2; }
    .room.solo1 { grid-column: 1 / 3; grid-row: 3; }
    .room.solo2 { grid-column: 3 / 5; grid-row: 3; border-color: var(--ok); }
    @media (max-width: 600px) {
      .floor-plan { grid-template-rows: repeat(3, 70px); }
      .room .name { font-size: 12px; }
    }
  </style>
</head>
<body data-page="club-map">
  <div id="site-header"></div>

  <main>
    <section class="hero" style="padding-bottom:24px;">
      <div class="wrap">
        <p class="kicker">club.map</p>
        <h1 style="max-width:16ch;">Карта клуба</h1>
        <p class="lead">Схематично — где что находится после входа.</p>
      </div>
    </section>

    <section class="block" style="padding-top:0;">
      <div class="wrap">
        <div class="floor-plan">
          <div class="room entrance"><div class="name">Вход</div>дверь клуба</div>
          <div class="room bar"><div class="name">Бар</div>кофе · холодильник</div>
          <div class="room duo1"><div class="name">DUO ROOM 1</div>2 места</div>
          <div class="room duo2"><div class="name">DUO ROOM 2</div>2 места</div>
          <div class="room solo1"><div class="name">SOLO ROOM</div>1 место</div>
          <div class="room solo2"><div class="name">SOLO+ ROOM</div>премиум</div>
        </div>
        <p class="sub">Схема условная — для точного плана и фото комнат см. <a href="/club.html" style="color:var(--accent);">«О клубе»</a>.</p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/js/layout.js"></script>
</body>
</html>
