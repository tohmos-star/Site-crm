<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как нас найти — 404</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-page="location">
  <div id="site-header"></div>
  <main>
    <section class="hero" style="padding-bottom:32px;">
      <div class="wrap">
        <p class="kicker">club.location</p>
        <h1 style="max-width:16ch;">Два адреса в Самаре</h1>
        <p class="lead">Вход по коду доступа после верификации — домофон откроется автоматически.</p>
      </div>
    </section>

    <section class="block" style="padding-top:0;">
      <div class="wrap">
        <div class="grid cols-2" style="margin-bottom:32px;">
          <div class="panel">
            <h3>Чапаевская, 178</h3>
            <p>Вход со двора, домофон «404».</p>
          </div>
          <div class="panel">
            <h3>Красноармейская, 12А</h3>
            <p>Reborn — второй зал, вход с главного фасада.</p>
          </div>
        </div>
        <div class="map-embed" style="margin-bottom:32px;">
          <iframe
            src="https://yandex.ru/map-widget/v1/?text=Самара%20Чапаевская%20178"
            loading="lazy"
            allowfullscreen>
          </iframe>
        </div>

        <h2 style="font-size:22px; margin-bottom:16px;">Маршрут от улицы до двери</h2>
        <div class="grid cols-3" style="margin-bottom:8px;">
          <figure class="route-step"><img src="/assets/route/01-banner-street.webp" alt="Уличный баннер у ЮниКредит Банка" loading="lazy"><figcaption><span class="tag">1</span>Уличный баннер у ЮниКредит Банка — нашли его? вы на месте</figcaption></figure>
          <figure class="route-step"><img src="/assets/route/02-arch.webp" alt="Арка между домами" loading="lazy"><figcaption><span class="tag">2</span>Через арку между домами</figcaption></figure>
          <figure class="route-step"><img src="/assets/route/03-gate.webp" alt="Калитка ворот" loading="lazy"><figcaption><span class="tag">3</span>Калитка ворот — открывается от себя</figcaption></figure>
          <figure class="route-step"><img src="/assets/route/04-courtyard-arrow.webp" alt="Вход во двор" loading="lazy"><figcaption><span class="tag">4</span>Вход во двор — по стрелке</figcaption></figure>
          <figure class="route-step"><img src="/assets/route/05-entrance-door.webp" alt="Вход в подъезд" loading="lazy"><figcaption><span class="tag">5</span>В подъезд — табличка «не курить»</figcaption></figure>
          <figure class="route-step"><img src="/assets/route/06-intercom.webp" alt="Домофон и клубный WiFi" loading="lazy"><figcaption><span class="tag">6</span>Домофон открывается ссылкой из шага регистрации</figcaption></figure>
          <figure class="route-step"><img src="/assets/route/07-stairs-down.webp" alt="Спуск к двери клуба" loading="lazy"><figcaption><span class="tag">7</span>Сразу вниз — там дверь клуба</figcaption></figure>
          <figure class="route-step"><img src="/assets/route/08-club-door.webp" alt="Дверь клуба с замком" loading="lazy"><figcaption><span class="tag">8</span>Дверь клуба — замок открывается кодом</figcaption></figure>
          <figure class="route-step"><img src="/assets/route/09-welcome.webp" alt="Экран приветствия внутри клуба" loading="lazy"><figcaption><span class="tag">9</span>Добро пожаловать в 404!</figcaption></figure>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/js/layout.js"></script>
</body>
</html>
