services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD:-crm}@postgres:5432/crm?schema=public
      PORT: 3000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    ports:
      - "3000:3000"

  # Одноразовый прогон seed'а (создаёт клуб/зоны/тарифы + дефолтного админа,
  # идемпотентно — см. prisma/seed.ts). Собран из стадии build, а не
  # runtime, — раннер-образ app не содержит src/ (seed.ts импортирует
  # ../src/lib/password.js) и devDependencies (tsx). profiles: не поднимается
  # обычным `docker compose up`, только явным `--profile tools run seed`.
  seed:
    build:
      context: .
      target: build
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD:-crm}@postgres:5432/crm?schema=public
    command: ["npx", "tsx", "prisma/seed.ts"]

volumes:
  postgres_data:
